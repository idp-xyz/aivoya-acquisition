<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AIVOYA · 采集管理后台</title>
<style>
:root{color-scheme:dark;--bg:#070e15;--panel:#0e1924;--line:#243846;--text:#e7f3f7;--muted:#7f97a8;--mint:#70f1d0;--yellow:#f3c879;--red:#ff8b9a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.shell{min-height:100vh;display:flex}
.nav{width:196px;flex-shrink:0;background:#091019;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;letter-spacing:.08em;margin:0 8px 22px}.brand span{color:var(--mint)}
.nav button{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:10px 12px;color:#b7c9d4;margin-bottom:4px}
.nav button.on{background:#143432;border-color:#2a6560;color:var(--mint)}
.main{flex:1;min-width:0;padding:22px 26px 60px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:22px;margin:0;font-weight:700}
.spacer{flex:1}
input,select{background:#0d1b26;border:1px solid #335266;border-radius:8px;padding:9px 11px}
button.act{background:#14232f;border:1px solid #335266;border-radius:8px;padding:9px 12px}
button.primary{background:var(--mint);color:#07312e;border-color:var(--mint);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:28px;letter-spacing:-.04em}
.stat span{color:var(--muted);font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line)}
.tools input[type="search"]{min-width:220px;flex:1}
.table-wrap{overflow:auto;max-height:calc(100vh - 280px)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;border-bottom:1px solid #1d3140;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#12202b;color:var(--muted);font-size:11px;letter-spacing:.06em}
td .sub{color:var(--muted);font-size:12px}
.pill{display:inline-block;border-radius:99px;padding:2px 8px;font-size:12px;background:#243246}
.ok{background:#14382f;color:#9cf3d8}.wait{background:#3d3420;color:#ffd79a}.bad{background:#3d2228;color:#ffb3bd}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.row-actions button{padding:5px 8px;font-size:12px}
#status{min-height:1.4em;color:var(--muted);font-size:12px}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.card{width:min(520px,100%);background:#0f1e29;border:1px solid #315564;border-radius:14px;padding:20px}
.card h2{margin:0 0 8px;font-size:18px}
.card p{color:var(--muted);font-size:13px}
label{display:block;margin:12px 0 6px;font-size:12px;color:#b7d0d8}
label input,label select{width:100%;margin-top:6px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
a{color:#8ee7ff}
@media(max-width:800px){.nav{width:100%;height:auto;position:static}.shell{display:block}.nav{display:flex;gap:6px;overflow:auto;padding:12px}.brand{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="shell">
<aside class="nav">
  <div class="brand">AI<span>VOYA</span></div>
  <button type="button" class="on" data-view="sources">来源</button>
  <button type="button" data-view="jobs">任务</button>
  <button type="button" data-view="records">记录</button>
  <button type="button" data-view="health">健康</button>
</aside>
<main class="main">
  <div class="top">
    <h1 id="title">来源</h1>
    <div class="spacer"></div>
    <input id="token" type="password" autocomplete="off" placeholder="管理令牌"/>
    <button type="button" class="act primary" id="connect">连接</button>
    <button type="button" class="act" id="refresh">刷新</button>
    <label class="act">导入 JSON<input id="upload" type="file" accept="application/json,.json" hidden/></label>
  </div>
  <div id="status">连接后读取来源、任务、记录和健康。</div>
  <section class="stats" aria-label="汇总">
    <div class="stat"><b id="n-sources">—</b><span>来源</span></div>
    <div class="stat"><b id="n-approved">—</b><span>已批准</span></div>
    <div class="stat"><b id="n-records">—</b><span>记录</span></div>
    <div class="stat"><b id="n-jobs">—</b><span>任务</span></div>
  </section>
  <section class="panel" id="view-sources">
    <div class="tools">
      <input id="q" type="search" placeholder="名称、ID 或类别" aria-label="搜索来源"/>
      <select id="f-review" aria-label="审批状态"><option value="">全部审批</option><option>pending</option><option>approved</option><option>denied</option></select>
      <select id="f-mode" aria-label="采集方式"><option value="">全部方式</option><option>rss</option><option>html_index</option><option>monitor</option><option>html_static</option><option>browser_render</option><option>github_releases</option><option>api</option><option>manual</option></select>
    </div>
    <div class="table-wrap"><table><thead><tr><th>来源</th><th>方式</th><th>权利</th><th>审批</th><th>间隔</th><th>操作</th></tr></thead><tbody id="sources"></tbody></table></div>
  </section>
  <section class="panel" id="view-jobs" hidden>
    <div class="table-wrap"><table><thead><tr><th>任务</th><th>来源</th><th>方式</th><th>状态</th><th>次数</th><th>地址</th></tr></thead><tbody id="jobs"></tbody></table></div>
  </section>
  <section class="panel" id="view-records" hidden>
    <div class="table-wrap"><table><thead><tr><th>标题</th><th>来源</th><th>类型</th><th>质量</th></tr></thead><tbody id="records"></tbody></table></div>
  </section>
  <section class="panel" id="view-health" hidden>
    <div class="table-wrap"><table><thead><tr><th>来源</th><th>方式</th><th>任务</th><th>成功</th><th>复核</th><th>失败</th><th>阻断</th><th>成功率</th></tr></thead><tbody id="health"></tbody></table></div>
  </section>
</main>
</div>
<div class="modal" id="modal" hidden>
  <form class="card" id="form">
    <h2 id="modal-title">来源</h2>
    <p id="modal-note"></p>
    <div id="fields"></div>
    <div class="modal-actions">
      <button type="button" class="act" id="cancel">取消</button>
      <button type="submit" class="act primary" id="save">保存</button>
    </div>
  </form>
</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pill = (t, kind) => `<span class="pill ${kind || ''}">${esc(t)}</span>`;
  const tone = t => t === 'approved' || t === 'succeeded' || t === true ? 'ok' : t === 'pending' || t === 'review' || t === 'leased' ? 'wait' : t === 'denied' || t === 'failed' || t === 'blocked' ? 'bad' : '';
  const state = {token:'', view:'sources', sources:[], jobs:[], records:[], health:[], stats:{}, action:null, timer:null};
  const titles = {sources:'来源', jobs:'任务', records:'记录', health:'健康'};

  function say(text, bad){ const el = $('status'); el.textContent = text; el.style.color = bad ? 'var(--red)' : 'var(--muted)'; }
  async function api(path, options={}){
    if (!state.token) throw Error('先连接管理令牌');
    const res = await fetch(path, {method:options.method || 'GET', headers:{Authorization:'Bearer '+state.token, 'Content-Type':'application/json'}, body:options.body, cache:'no-store'});
    const raw = await res.text();
    let data = {};
    try { data = raw ? JSON.parse(raw) : {}; } catch { throw Error('服务返回的不是 JSON'); }
    if (!res.ok) throw Error(data.error || `HTTP ${res.status}`);
    return data;
  }
  function field(name, label, value, type='text'){
    return `<label>${esc(label)}<input name="${esc(name)}" type="${type}" value="${esc(value)}" ${type==='number'?'min="5" max="10080" required':''}/></label>`;
  }
  function select(name, label, value, options){
    return `<label>${esc(label)}<select name="${esc(name)}">${options.map(o => `<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
  }
  function openModal(action, source){
    state.action = {action, id: source.source_id};
    $('modal-title').textContent = source.name;
    const modes = ['rss','html_index','monitor','html_static','browser_render','github_releases','api','manual'];
    const rights = ['metadata_only','extract_only','full_text_licensed'];
    if (action === 'approve') {
      $('modal-note').textContent = '审批后按所选权利启用采集。请填写依据。';
      $('fields').innerHTML = select('rights','内容权利','metadata_only', rights) + field('reviewer','审核人','') + field('basis','依据','');
    } else if (action === 'deny') {
      $('modal-note').textContent = '拒绝后停用该来源，并清除已保存内容。';
      $('fields').innerHTML = field('reviewer','审核人','') + field('basis','依据','');
    } else {
      $('modal-note').textContent = '修改入口或来源主机会撤销当前审批，并清除该来源已保存内容。';
      $('fields').innerHTML = field('origin_url','来源主机', source.origin_url || '') + field('endpoint_url','采集入口', source.endpoint_url || '') + select('access_mode','采集方式', source.access_mode, modes) + field('interval_minutes','间隔（分钟）', source.interval_minutes || 60, 'number') + field('reviewer','变更人','') + field('basis','依据','');
    }
    $('modal').hidden = false;
    $('fields').querySelector('input,select').focus();
  }
  function closeModal(){ $('modal').hidden = true; state.action = null; $('form').reset(); }
  function filtered(){
    const q = $('q').value.trim().toLowerCase();
    const review = $('f-review').value;
    const mode = $('f-mode').value;
    return state.sources.filter(s => {
      if (review && s.review_status !== review) return false;
      if (mode && s.access_mode !== mode) return false;
      return [s.name, s.source_id, s.category, s.origin_url].join(' ').toLowerCase().includes(q);
    });
  }
  function renderSources(){
    const rows = filtered();
    $('sources').innerHTML = rows.map(s => `<tr>
      <td><strong>${esc(s.name)}</strong><div class="sub">${esc(s.source_id)} · ${esc(s.region || '')}</div></td>
      <td>${esc(s.access_mode)}</td>
      <td>${esc(s.rights)}</td>
      <td>${pill(s.review_status, tone(s.review_status))}<div class="sub">${s.enabled ? '已启用' : '未启用'}</div></td>
      <td>${esc(s.interval_minutes)} 分钟</td>
      <td class="row-actions">
        ${s.review_status === 'pending' ? `<button type="button" class="act" data-act="approve" data-id="${esc(s.source_id)}">审批</button>` : ''}
        ${s.review_status === 'approved' && s.enabled ? `<button type="button" class="act" data-act="enqueue" data-id="${esc(s.source_id)}">采集</button>` : ''}
        <button type="button" class="act" data-act="configure" data-id="${esc(s.source_id)}">设置</button>
        ${s.review_status !== 'denied' ? `<button type="button" class="act" data-act="deny" data-id="${esc(s.source_id)}">拒绝</button>` : ''}
      </td></tr>`).join('') || '<tr><td colspan="6">没有匹配来源</td></tr>';
  }
  function renderJobs(){
    $('jobs').innerHTML = state.jobs.map(j => `<tr><td class="sub">${esc(j.job_id)}</td><td>${esc(j.source_id)}</td><td>${esc(j.method)}</td><td>${pill(j.status, tone(j.status))}</td><td>${esc(j.attempt)}</td><td class="sub">${esc(j.url)}</td></tr>`).join('') || '<tr><td colspan="6">暂无任务</td></tr>';
  }
  function renderRecords(){
    $('records').innerHTML = state.records.map(r => `<tr><td><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a></td><td>${esc(r.source_id)}</td><td>${esc(r.kind)}</td><td>${Math.round((r.quality_score || 0) * 100)}%</td></tr>`).join('') || '<tr><td colspan="4">暂无记录</td></tr>';
  }
  function renderHealth(){
    $('health').innerHTML = state.health.map(h => `<tr><td><strong>${esc(h.name)}</strong><div class="sub">${esc(h.source_id)} · ${h.enabled ? '已启用' : '未启用'}</div></td><td>${esc(h.access_mode)}</td><td>${esc(h.jobs)}</td><td>${esc(h.succeeded)}</td><td>${esc(h.review)}</td><td>${esc(h.failed)}</td><td>${esc(h.blocked)}</td><td>${h.terminal_success_ratio == null ? '—' : Math.round(h.terminal_success_ratio * 100) + '%'}</td></tr>`).join('') || '<tr><td colspan="8">暂无健康数据</td></tr>';
  }
  function render(){
    const jobs = state.stats.jobs || {};
    const jobCount = Object.values(jobs).reduce((n, v) => n + Number(v || 0), 0);
    $('n-sources').textContent = state.stats.sources ?? '—';
    $('n-approved').textContent = state.stats.approved_sources ?? '—';
    $('n-records').textContent = state.stats.records ?? '—';
    $('n-jobs').textContent = jobCount || '—';
    renderSources(); renderJobs(); renderRecords(); renderHealth();
  }
  async function load(){
    const [stats, sources, jobs, records, health] = await Promise.all([
      api('/v1/stats'), api('/v1/sources'), api('/v1/jobs?limit=200'), api('/v1/records?limit=200'), api('/v1/operations/source-health')
    ]);
    state.stats = stats; state.sources = sources; state.jobs = jobs; state.records = records; state.health = health;
    render();
    say(`已同步 ${sources.length} 个来源 · ${new Date().toLocaleTimeString()}`);
  }
  function show(view){
    state.view = view;
    $('title').textContent = titles[view];
    for (const name of Object.keys(titles)) $('view-' + name).hidden = name !== view;
    document.querySelectorAll('.nav button').forEach(btn => btn.classList.toggle('on', btn.dataset.view === view));
  }
  $('connect').onclick = async () => {
    state.token = $('token').value.trim();
    $('token').value = '';
    try { await load(); clearInterval(state.timer); state.timer = setInterval(() => load().catch(e => say(e.message, true)), 15000); }
    catch (e) { state.token = ''; say(e.message, true); }
  };
  $('refresh').onclick = () => load().catch(e => say(e.message, true));
  $('q').oninput = renderSources;
  $('f-review').onchange = renderSources;
  $('f-mode').onchange = renderSources;
  document.querySelector('.nav').onclick = e => { const btn = e.target.closest('button[data-view]'); if (btn) show(btn.dataset.view); };
  $('sources').onclick = async e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const source = state.sources.find(s => s.source_id === btn.dataset.id);
    if (!source) return;
    if (btn.dataset.act === 'enqueue') {
      try { await api('/v1/sources/' + encodeURIComponent(source.source_id) + '/enqueue', {method:'POST', body:'{}'}); say('已提交采集：' + source.source_id); await load(); }
      catch (err) { say(err.message, true); }
      return;
    }
    openModal(btn.dataset.act, source);
  };
  $('cancel').onclick = closeModal;
  $('modal').onclick = e => { if (e.target === $('modal')) closeModal(); };
  $('form').onsubmit = async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    const id = state.action.id;
    try {
      if (state.action.action === 'approve') {
        await api('/v1/sources/' + encodeURIComponent(id) + '/approve', {method:'POST', body:JSON.stringify({rights:data.rights, enabled:true, reviewer:data.reviewer, basis:data.basis})});
      } else if (state.action.action === 'deny') {
        await api('/v1/sources/' + encodeURIComponent(id) + '/deny', {method:'POST', body:JSON.stringify({reviewer:data.reviewer, basis:data.basis})});
      } else {
        await api('/v1/sources/' + encodeURIComponent(id) + '/configure', {method:'POST', body:JSON.stringify({origin_url:data.origin_url, endpoint_url:data.endpoint_url, access_mode:data.access_mode, interval_minutes:Number(data.interval_minutes), reviewer:data.reviewer, basis:data.basis})});
      }
      closeModal();
      await load();
    } catch (err) { say(err.message, true); }
  };
  $('upload').onchange = async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const doc = JSON.parse(await file.text());
      if (!Array.isArray(doc.sources)) throw Error('JSON 必须包含 sources 数组');
      let count = 0;
      for (let i = 0; i < doc.sources.length; i += 500) {
        const res = await api('/v1/sources/import', {method:'POST', body:JSON.stringify({sources:doc.sources.slice(i, i + 500)})});
        count += res.imported;
      }
      say('已导入 ' + count + ' 条来源，新来源默认待审');
      await load();
    } catch (err) { say(err.message, true); }
  };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
})();
</script>
</body>
</html>
